<!doctype html>
<!-- Dev only (npx vite → /tools/figtest.html): one band member on a turntable, for checking the MPFB bodies.
     ?part=guitar&preset=punk&yaw=0.4&zoom=head&t=1.2 ; window.fig exposes the member. -->
<html>
<head><meta charset="utf-8"><title>figure test</title>
<style>html,body{margin:0;height:100%;background:#222;overflow:hidden}canvas{display:block}</style></head>
<body>
<script type="module">
import * as THREE from 'three';
import { createMember, animateMember } from '/src/game/figure.js';
import { fromPreset } from '/src/profile/looks.js';
import { loadHuman } from '/src/game/human.js';
const q = new URLSearchParams(location.search);
const part = q.get('part') || 'guitar';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.append(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2a30);
scene.add(new THREE.HemisphereLight(0xffffff, 0x404050, 1.4));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(2, 4, 5); scene.add(key);
const rim = new THREE.DirectionalLight(0x88aaff, 1.2); rim.position.set(-3, 3, -4); scene.add(rim);
const floor = new THREE.Mesh(new THREE.CircleGeometry(3, 48), new THREE.MeshStandardMaterial({ color: 0x333338 })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 50);
const m = createMember(scene, part, { x: 0, y: 0, z: 0, rotY: 0, scale: 1.05 });
const look = q.get('preset') ? fromPreset(q.get('preset'), part) : null;
if (look) for (const [k, v] of q) if (k in look && k !== 'part') look[k] = v;
m.setLook(look);
window.fig = m; window.THREE = THREE;
const shots = { full: [1.05, 4.6], head: [1.78, 0.9], torso: [1.45, 2.2], legs: [0.6, 2.4], hands: [1.15, 1.6] };
let yaw = +(q.get('yaw') || 0), shot = shots[q.get('zoom') || 'full'];
const fixedT = q.get('t');
window.view = (y, z) => { yaw = y; shot = Array.isArray(z) ? z : shots[z] || shot; };
window.set = (o) => m.setLook({ ...m.look, ...o });
const t0 = performance.now();
await Promise.all([loadHuman('m'), loadHuman('f')]).catch(() => {});
function frame() {
  const t = fixedT !== null ? +fixedT : (performance.now() - t0) / 1000;
  const bp = t * 4;
  animateMember(m, { bp, hb: Math.max(0, Math.sin(bp)) * 0.3, energy: 0.8, od: false, t, pulse: 0 });
  cam.position.set(Math.sin(yaw) * shot[1], shot[0] + 0.1, Math.cos(yaw) * shot[1]);
  cam.lookAt(0, shot[0], 0);
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
