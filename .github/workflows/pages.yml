# The website (site/) → the gh-pages branch → https://stemstage.varconstint.com
# (Pages source: Settings → Pages → Deploy from a branch → gh-pages / root)
name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          cname: stemstage.varconstint.com
          commit_message: 'Website from ${{ github.sha }}'
