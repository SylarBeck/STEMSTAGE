[package]
name = "stemstage"
version = "1.2.0"
description = "STEMSTAGE desktop app: the AI rhythm game that plays any song"
edition = "2021"
publish = false

[lib]
name = "stemstage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
