# Push a tag like v1.4.0 → builds the Windows installer and the Linux packages (AppImage, .deb, .rpm) and
# publishes them in one GitHub Release, with latest.json for the in-app updater (Windows + AppImage).
#
# One-time setup for signed updates: repository → Settings → Secrets and variables → Actions → New secret
#   TAURI_SIGNING_PRIVATE_KEY = the contents of %USERPROFILE%\.tauri\stemstage.key
# (the matching public key is in src-tauri/tauri.conf.json → plugins.updater.pubkey). Without the secret the
# release still builds; it just has no update files, so installed copies won't update themselves to it.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis
          - platform: ubuntu-22.04 # oldest supported glibc, so the AppImage runs on most distros
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.platform }}
    env:
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils rpm \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}
      - run: npm ci

      - name: Skip update files (no signing key)
        if: env.HAS_SIGNING_KEY != 'true'
        shell: bash
        run: |
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/no-updater.json"
          echo "EXTRA_ARGS=--config $RUNNER_TEMP/no-updater.json" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          STEMSTAGE_UPDATE_REPO: ${{ github.repository }}
        with:
          tagName: v__VERSION__
          releaseName: STEMSTAGE v__VERSION__
          releaseBody: |
            **STEMSTAGE 3.0**: you hear what you play, and no night is the same twice.
            - **Live notes**: your part sounds note by note as you hit it. Early sounds early, late sounds late, a missed note goes quiet while the one before it rings out, a sustain stops when you let go, and the whammy bends the real audio. Settings → Audio → Live notes.
            - **Song sections**: every song knows its intro, verses, choruses and solos, old songs too. Solos get a live counter and a bonus, drummers launch overdrive with a fill at the start of a new section, and when a song rings out at the end you get a big rock ending. Practice can start at any section.
            - **Freestyle solos** (Settings → Gameplay): in a guitar or keys solo the notes drop away and you improvise with the song's own guitar or keys, in its key. Graded on groove, flow and melody.
            - **Runs** (main menu): a roguelike climb through eight floors of your own songs to the headliner, with three hearts, perks, curses, the merch stand and a daily run.
            - **Discover** (main menu): setlists the game builds from your library, songs like the ones you play (one click to find them on YouTube), and your stats.
            - **Better looking**: the stage reflects its own lights (High and Ultra), the key light casts soft shadows (Ultra), and each part of the band moves the stage: the kick hits the lights, the bass breathes the haze.
            - **Feel the band** (Settings → Controllers): the kick drum and the bass line rumble in your controller, and the DualSense triggers push back harder on strong notes.
            - **Tighter charts**: new imports line every note up with its real sound (within 20 ms).
            - The score panel now fits narrow windows.
            Bonuses pay cash and XP, never score, so the leaderboards stay fair; freestyle and Runs results aren't ranked.
            Online play needs everyone on 3.0.

            **Windows:** download `STEMSTAGE_*_x64-setup.exe` and run it.
            **Linux:** `STEMSTAGE_*_amd64.AppImage` (any distro: `chmod +x` and run), or the `.deb` (Ubuntu / Debian) / `.rpm` (Fedora / openSUSE) package.
            The installer includes the game runtime and configures the controller bridge. The optional AI splitter is offered only when an NVIDIA GPU and working driver are detected; otherwise the game uses its built-in DSP splitter.
            DualSense speaker audio and native audio haptics require a wired USB controller and a four-channel audio output. Bluetooth controller input remains supported. For multiple wired controllers, assign each output in Settings → Controllers.
            Installed copies update themselves (Settings → Updates).
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles ${{ matrix.bundles }} ${{ env.EXTRA_ARGS }}

      - name: Attest Windows installer provenance
        if: runner.os == 'Windows'
        uses: actions/attest@v4
        with:
          subject-path: src-tauri/target/release/bundle/nsis/*.exe
