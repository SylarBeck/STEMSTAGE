# Push a tag like v1.4.0 → builds the Windows installer and the Linux packages (AppImage, .deb, .rpm) and
# publishes them in one GitHub Release, with latest.json for the in-app updater (Windows + AppImage).
#
# One-time setup for signed updates: repository → Settings → Secrets and variables → Actions → New secret
#   TAURI_SIGNING_PRIVATE_KEY = the contents of %USERPROFILE%\.tauri\stemstage.key
# (the matching public key is in src-tauri/tauri.conf.json → plugins.updater.pubkey). Without the secret the
# release still builds; it just has no update files, so installed copies won't update themselves to it.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis
          - platform: ubuntu-22.04 # oldest supported glibc, so the AppImage runs on most distros
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.platform }}
    env:
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils rpm \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}
      - run: npm ci

      - name: Skip update files (no signing key)
        if: env.HAS_SIGNING_KEY != 'true'
        shell: bash
        run: |
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/no-updater.json"
          echo "EXTRA_ARGS=--config $RUNNER_TEMP/no-updater.json" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          STEMSTAGE_UPDATE_REPO: ${{ github.repository }}
        with:
          tagName: v__VERSION__
          releaseName: STEMSTAGE v__VERSION__
          releaseBody: |
            **STEMSTAGE 2.0.1** — real people on stage.
            - **New band members**: every character is now a real, fully rigged person made with MakeHuman: two body types, four face shapes, builds and heights, ten hair styles, beards, and real clothes (tees, long sleeves, shirts, blouses, jackets, suits, jeans, skirts, overalls, six kinds of shoes) in any colour. Nobody's clothes clip and nobody goes without them.
            - **Instrument animations redone**: hands grip the guitar neck and strum over the strings, play the keys palms-down, hold the mic to the mouth, and drum on a proper right-handed kit.
            - **Smoother**: shaders for worlds and bosses compile while the song loads (no freeze when a boss appears), a lighter crowd, and an automatic render scale that keeps the frame rate up on laptops and integrated graphics.
            - **Backstage**: matches the rest of the game; body, face, bottoms and shoes have their own pickers.
            Plays online with everyone on 2.0.

            **STEMSTAGE 2.0** — the biggest update yet.
            - **Backstage**: a new screen to build your rock star (detailed, animated characters: hair, faces, clothes, accessories, LED trim, stage moves) and your instruments (models, paint, hardware, LED glow), with live 3D previews of every item.
            - **Gear**: upgrade pickups, amps, strings and more with cash, and equip pedals that change how you play (overdrive, sustain, streak shields, timing, multiplier, boss damage). Gear runs stay off the world leaderboard; turn gear off for ranked play.
            - **Five worlds with bosses**: Abyssal Aquarium (the Leviathan), Orbital Nebula (the Void Conductor), Volcanic Forge (the Magma Titan), Crystal Aurora (the Frost Wyrm) and Storm Citadel (the Thunderbird). Bosses show up mid-song, attack your highway, and drop cash, pedals, wardrobe pieces and trophies.
            - **Stage creator**: build your own stages from backdrops, floors, light rigs, props, atmosphere and colours.
            - **Online**: Find match (skill rating, region, mode), host controls (stage, bosses, gear, room size, lock, auto-start, kick), ping per player, spectating, faster recovery from dropped connections, version checks.
            Online play needs everyone on 2.0 or later.

            **Windows:** download `STEMSTAGE_*_x64-setup.exe` and run it.
            **Linux:** `STEMSTAGE_*_amd64.AppImage` (any distro: `chmod +x` and run), or the `.deb` (Ubuntu / Debian) / `.rpm` (Fedora / openSUSE) package.
            The installer includes the game runtime and configures the controller bridge. The optional AI splitter is offered only when an NVIDIA GPU and working driver are detected; otherwise the game uses its built-in DSP splitter.
            DualSense speaker audio and native audio haptics require a wired USB controller and a four-channel audio output. Bluetooth controller input remains supported. For multiple wired controllers, assign each output in Settings → Controllers.
            Installed copies update themselves (Settings → Updates).
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles ${{ matrix.bundles }} ${{ env.EXTRA_ARGS }}

      - name: Attest Windows installer provenance
        if: runner.os == 'Windows'
        uses: actions/attest@v4
        with:
          subject-path: src-tauri/target/release/bundle/nsis/*.exe
