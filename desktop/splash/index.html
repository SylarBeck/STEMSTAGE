<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>STEMSTAGE</title>
  <style>
    @font-face { font-family: 'Big Shoulders Stencil Display'; src: url('fonts/BigShouldersStencilDisplay.ttf') format('truetype'); font-weight: 100 900; }
    @font-face { font-family: 'Barlow Condensed'; src: url('fonts/BarlowCondensed-SemiBold.ttf') format('truetype'); font-weight: 600; }
    @font-face { font-family: 'Barlow Condensed'; src: url('fonts/BarlowCondensed-ExtraBold.ttf') format('truetype'); font-weight: 800; }
    html, body { margin: 0; height: 100%; background: #0b0a09; color: #ece5d3; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; overflow: hidden; user-select: none; }
    body { display: grid; place-items: center; background: radial-gradient(ellipse 55% 45% at 50% 38%, #2a1a10 0%, #120d0a 55%, #0b0a09 85%); }
    .wrap { display: flex; flex-direction: column; align-items: center; gap: 28px; animation: in .5s cubic-bezier(.2,.8,.2,1); }
    .word { font-family: 'Big Shoulders Stencil Display', 'Arial Black', sans-serif; font-weight: 900; font-size: min(150px, 17vw); line-height: .9; color: #ece5d3; text-shadow: 6px 6px 0 #df3a2c; }
    .check { font-weight: 800; font-size: 17px; letter-spacing: .3em; text-transform: uppercase; color: #a59d8b; animation: blink 1.1s steps(1) infinite; }
    .status { width: 440px; font-size: 18px; display: flex; flex-direction: column; border-top: 2px solid #ece5d3; }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 2px; border-bottom: 1px solid rgba(236,229,211,.12); }
    .row b { font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
    .row span { color: #a59d8b; text-transform: uppercase; letter-spacing: .06em; }
    .row .ok { color: #8dc044; } .row .warn { color: #f0b429; } .row .err { color: #e5402f; }
    .msg { max-width: 560px; text-align: center; color: #f19b8e; font-size: 17px; line-height: 1.4; min-height: 20px; }
    button { font: 800 16px 'Barlow Condensed', sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #fff5ea; background: #df3a2c; border: 0; border-radius: 2px; padding: 10px 22px; cursor: pointer; }
    button:hover { background: #ece5d3; color: #15120e; }
    @keyframes blink { 0%, 62% { opacity: 1; } 63%, 100% { opacity: .25; } }
    @keyframes in { from { opacity: 0; transform: translateY(10px); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="word">STEMSTAGE</div>
    <div class="check">Soundcheck</div>
    <div class="status" id="status"></div>
    <div class="msg" id="msg"></div>
    <button id="retry" hidden>Retry</button>
  </div>
  <script>
    const LABEL = { game: 'Game server', ai: 'AI stem splitter', bridge: 'DualSense controller bridge' };
    const cls = (v) => (!v || v === 'starting' ? '' : v === 'running' ? 'ok' : v.startsWith('error') ? 'err' : 'warn');
    const invoke = window.__TAURI__?.core?.invoke;
    const t0 = Date.now();
    let status = {};
    async function tick() {
      try { if (invoke) status = await invoke('launcher_status'); } catch { /* not ready yet */ }
      document.getElementById('status').innerHTML = Object.entries(LABEL).map(([k, l]) =>
        `<div class="row"><b>${l}</b><span class="${cls(status[k])}">${(status[k] || 'starting').replace(/^error: /, 'error')}</span></div>`).join('');
      const url = status.url || 'http://127.0.0.1:5173/';
      try {
        const r = await fetch(`${url}api/health`, { cache: 'no-store' });
        if (r.ok) { location.replace(url); return; }
      } catch { /* still starting */ }
      if (status.game?.startsWith('error') || Date.now() - t0 > 30000) {
        document.getElementById('msg').textContent = status.game?.startsWith('error')
          ? status.game.replace(/^error: /, '')
          : `The game server did not start. Logs: ${status.logs || '%LOCALAPPDATA%\\stemstage\\logs'}`;
        document.getElementById('retry').hidden = false;
        return;
      }
      setTimeout(tick, 350);
    }
    document.getElementById('retry').onclick = () => location.reload();
    tick();
  </script>
</body>
</html>
