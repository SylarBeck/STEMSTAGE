<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>STEMSTAGE overlay</title>
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" />
  <!-- OBS Browser Source (1920×1080, transparent). Live data from the game via /api/stream/events. -->
  <style>
    @font-face { font-family: 'Anton'; src: url('/fonts/Anton-Regular.ttf') format('truetype'); }
    @font-face { font-family: 'Barlow Condensed'; src: url('/fonts/BarlowCondensed-SemiBold.ttf') format('truetype'); font-weight: 600; }
    @font-face { font-family: 'Barlow Condensed'; src: url('/fonts/BarlowCondensed-ExtraBold.ttf') format('truetype'); font-weight: 800; }
    @font-face { font-family: 'Permanent Marker'; src: url('/fonts/PermanentMarker-Regular.ttf') format('truetype'); }
    :root { --red: #df3a2c; --gold: #f0b429; --ink: #ece5d3; --dim: #a59d8b; --card: rgba(13,12,10,0.9); }
    html, body { margin: 0; background: transparent; color: var(--ink); font-family: 'Barlow Condensed', sans-serif; font-weight: 600; overflow: hidden; }
    body { width: 100vw; height: 100vh; position: relative; }
    .card { background: url('/ui/grain.png'), var(--card); border-top: 6px solid var(--red); box-shadow: 0 18px 50px rgba(0,0,0,0.5); }
    .k { font-weight: 800; font-size: 16px; letter-spacing: 0.22em; color: var(--gold); text-transform: uppercase; }
    #now { position: absolute; left: 32px; bottom: 32px; display: grid; grid-template-columns: 120px 1fr; gap: 18px; padding: 16px; width: 560px; transition: opacity .4s, transform .4s; }
    #now.hide { opacity: 0; transform: translateY(20px); }
    #now .cv { width: 120px; height: 120px; background: linear-gradient(162deg, #8a3a2c 0 52%, #4a1d16 52%) center / cover; border: 5px solid #f7f3e9; transform: rotate(-2deg); }
    #now h1 { margin: 2px 0 0; font-family: 'Anton', sans-serif; font-weight: 400; font-size: 36px; line-height: 1.05; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #now .ar { color: var(--dim); font-size: 22px; }
    .bar { height: 6px; background: rgba(236,229,211,0.14); margin-top: 10px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--ink); }
    #players { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 0; }
    .pl { display: grid; grid-template-columns: 10px 1fr auto auto; gap: 12px; align-items: center; font-size: 20px; padding: 3px 0; border-bottom: 1px solid rgba(236,229,211,0.1); text-transform: uppercase; }
    .pl i { width: 10px; height: 10px; border-radius: 50%; } .pl b { font-family: 'Anton', sans-serif; font-weight: 400; font-size: 26px; }
    .pl em { font-style: normal; font-family: 'Anton', sans-serif; color: var(--ink); font-size: 19px; } .pl em.od { color: var(--gold); } .pl.failed { opacity: .5; }
    #side { position: absolute; right: 32px; top: 32px; width: 420px; display: flex; flex-direction: column; gap: 14px; }
    #vote, #reqs, #result { padding: 14px 18px 16px; }
    .opt { position: relative; display: grid; grid-template-columns: 34px 1fr 40px; gap: 10px; align-items: center; margin-top: 8px; padding: 6px 10px; background: rgba(236,229,211,0.06); overflow: hidden; }
    .opt .fill { position: absolute; inset: 0 auto 0 0; background: rgba(223,58,44,0.4); transition: width .4s; }
    .opt > * { position: relative; } .opt .n { font-family: 'Anton', sans-serif; font-size: 26px; color: var(--gold); } .opt .t { font-weight: 800; font-size: 21px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .opt .c { font-family: 'Anton', sans-serif; font-size: 22px; text-align: right; }
    .hint { color: var(--dim); font-size: 19px; margin-top: 8px; } .hint b { color: var(--ink); }
    .rq { font-size: 20px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .rq small { color: var(--dim); }
    #result .score { font-family: 'Anton', sans-serif; font-size: 60px; line-height: 1.1; text-shadow: 4px 4px 0 var(--red); } .stars { color: var(--gold); font-size: 26px; letter-spacing: 3px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="now" class="card hide">
    <div class="cv" id="cv"></div>
    <div><div class="k">Now playing</div><h1 id="title"></h1><div class="ar" id="artist"></div><div class="bar"><i id="prog" style="width:0"></i></div></div>
    <div id="players"></div>
  </div>
  <div id="side">
    <div id="vote" class="card" hidden></div>
    <div id="result" class="card" hidden></div>
    <div id="reqs" class="card" hidden></div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fa = (n) => `<i class="fa-solid fa-${n}"></i>`;
    const ICON = { guitar: fa('guitar'), bass: fa('guitar'), drums: fa('drum'), keys: fa('music'), vocals: fa('microphone') };
    const stars = (n) => Array.from({ length: 5 }, (_, i) => `<i class="fa-${i < n ? 'solid' : 'regular'} fa-star"></i>`).join('');
    function render(s) {
      const play = s.mode === 'play';
      $('now').classList.toggle('hide', !play);
      if (play) {
        $('title').textContent = s.song.title;
        $('artist').textContent = s.song.artist;
        $('cv').style.backgroundImage = s.song.cover ? `url('${s.song.cover}')` : '';
        $('prog').style.width = `${Math.round((s.progress || 0) * 100)}%`;
        $('players').innerHTML = s.players.map((p) => `<div class="pl ${p.failed ? 'failed' : ''}"><i style="background:${p.color || '#e2432f'}"></i><span>${esc(p.name)} ${ICON[p.instrument] || ''} <small>${esc(p.difficulty)}</small></span><b>${Number(p.score).toLocaleString()}</b><em class="${p.od ? 'od' : ''}">${p.mult}× · ${p.streak}</em></div>`).join('');
      }
      const v = s.vote;
      $('vote').hidden = !v;
      if (v) {
        const total = Math.max(1, v.tallies.reduce((a, b) => a + b, 0));
        $('vote').innerHTML = `<div class="k">Vote the next song · ${v.left}s</div>${v.options.map((o, i) => `<div class="opt"><div class="fill" style="width:${Math.round((v.tallies[i] / total) * 100)}%"></div><span class="n">${i + 1}</span><span class="t">${esc(o.title)}</span><span class="c">${v.tallies[i]}</span></div>`).join('')}<div class="hint">Type <b>!vote 1</b>–<b>${v.options.length}</b> in chat</div>`;
      }
      const r = s.mode === 'results' && s.result;
      $('result').hidden = !r;
      if (r) {
        const best = [...r.players].sort((a, b) => b.score - a.score)[0];
        $('result').innerHTML = `<div class="k">Results · ${esc(r.song.title)}</div><div class="score">${Number(best.score).toLocaleString()}</div><div class="stars">${stars(best.stars)}</div><div class="hint">${esc(best.name)} · ${Math.round(best.accuracy * 100)}% accuracy</div>`;
      }
      const reqs = s.requests || [];
      $('reqs').hidden = !reqs.length && !s.channel;
      $('reqs').innerHTML = `<div class="k">Song requests</div>${reqs.map((q) => `<div class="rq">${fa('music')} ${esc(q.title)} <small>— ${esc(q.user)}</small></div>`).join('') || '<div class="hint">Type <b>!sr</b> and a song name</div>'}${s.channel ? '<div class="hint"><b>!hype</b> lights up the stage</div>' : ''}`;
    }
    const es = new EventSource('/api/stream/events?role=overlay');
    es.addEventListener('hello', (e) => render(JSON.parse(e.data)));
    es.addEventListener('state', (e) => render(JSON.parse(e.data)));
  </script>
</body>
</html>
