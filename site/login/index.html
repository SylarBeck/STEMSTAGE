<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logging in · STEMSTAGE</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="../img/favicon.png" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #05030a; color: #f4f1fb; font: 600 18px 'Rajdhani', system-ui, sans-serif; text-align: center; padding: 16px; }
    a { color: #29e0ff; }
  </style>
</head>
<body>
  <p id="msg">Logging you in…</p>
  <script>
    // Discord comes back here: #access_token=…&expires_in=…&state=… (or ?error=… when cancelled)
    const KEY = 'stemstage.web.discord';
    const h = new URLSearchParams(location.hash.slice(1));
    const q = new URLSearchParams(location.search);
    let pending = null;
    try { pending = JSON.parse(sessionStorage.getItem(`${KEY}.state`) || 'null'); sessionStorage.removeItem(`${KEY}.state`); } catch { /* storage blocked */ }
    const back = pending && /^\/[^/]/.test(pending.back || '') ? pending.back : '/';
    history.replaceState(null, '', '/login/'); // don't leave the token in the address bar or history
    const fail = (why) => { document.getElementById('msg').innerHTML = `${why} <a href="${back}">Go back</a>`; };
    // prompt=none fails with "interaction_required" for first-time users: ask Discord again, with the consent screen
    if (q.get('error') === 'interaction_required' || h.get('error') === 'interaction_required') {
      const retry = new URLSearchParams({ client_id: '1553872601603117127', response_type: 'token', scope: 'identify', state: pending?.state || '', redirect_uri: `${location.origin}/login/` });
      try { sessionStorage.setItem(`${KEY}.state`, JSON.stringify(pending)); } catch { /* storage blocked */ }
      location.replace(`https://discord.com/oauth2/authorize?${retry}`);
    } else if (q.get('error') || h.get('error')) {
      fail((q.get('error') || h.get('error')) === 'access_denied' ? 'Discord login cancelled.' : 'Discord login didn\'t work.');
    } else if (!pending || h.get('state') !== pending.state || !h.get('access_token')) {
      fail('That login link expired.');
    } else {
      try {
        localStorage.setItem(KEY, JSON.stringify({ token: h.get('access_token'), expires: Date.now() + (Number(h.get('expires_in')) || 604800) * 1000 - 60000 }));
        sessionStorage.removeItem(`${KEY}.me`);
      } catch { /* storage blocked */ }
      location.replace(back);
    }
  </script>
</body>
</html>
